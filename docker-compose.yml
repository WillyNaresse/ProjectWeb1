version: '3.8'

services:
  web:
    image: php:8.2-apache
    container_name: projectweb1_app
    ports:
      - "8000:80"
    volumes:
      - ./public:/var/www/html
      - ./app:/var/www/app
      - ./config:/var/www/config
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
      - ./docker/apache/vhost.conf:/etc/apache2/sites-available/000-default.conf
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=autoportaldoc
    # Instalar as extensões pdo_mysql necessárias para a disciplina
    command: bash -c "docker-php-ext-install pdo pdo_mysql && a2enmod rewrite && docker-php-entrypoint apache2-foreground"

  db:
    image: mysql:8.0
    container_name: projectweb1_db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=autoportaldoc
    volumes:
      - ./database/tabelas.sql:/docker-entrypoint-initdb.d/1-tabelas.sql
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/2-seeds.sql
      - db_data:/var/lib/mysql

volumes:
  db_data:
